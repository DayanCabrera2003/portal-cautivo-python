# Configuración de dnsmasq para portal cautivo
# Redirige TODAS las peticiones DNS al gateway del portal

# Rango DHCP
dhcp-range=10.42.0.10,10.42.0.254,1h

# Gateway y DNS
dhcp-option=3,10.42.0.1
dhcp-option=6,10.42.0.1

# Interceptar URLs de detección de portales cautivos

# Android/Google
address=/connectivitycheck.gstatic.com/10.42.0.1
address=/www.google.com/10.42.0.1
address=/clients3.google.com/10.42.0.1
address=/clients4.google.com/10.42.0.1
address=/play.googleapis.com/10.42.0.1
address=/android.clients.google.com/10.42.0.1

# iOS/macOS/Apple
address=/captive.apple.com/10.42.0.1
address=/www.apple.com/10.42.0.1
address=/www.appleiphonecell.com/10.42.0.1
address=/www.itools.info/10.42.0.1
address=/www.ibook.info/10.42.0.1
address=/www.airport.us/10.42.0.1
address=/www.thinkdifferent.us/10.42.0.1

# Windows
address=/www.msftconnecttest.com/10.42.0.1
address=/www.msftncsi.com/10.42.0.1
address=/ipv6.msftconnecttest.com/10.42.0.1

# Firefox/Mozilla
address=/detectportal.firefox.com/10.42.0.1

# Linux/GNOME
address=/nmcheck.gnome.org/10.42.0.1
address=/connectivity-check.ubuntu.com/10.42.0.1

# Redirigir TODAS las demás peticiones DNS al portal
address=/#/10.42.0.1

# No leer /etc/resolv.conf
no-resolv
no-poll

# No hacer forward de peticiones sin dominio
domain-needed
bogus-priv

# Escuchar solo en la interfaz del hotspot
interface=wlo1
bind-interfaces

# Log para debug
log-queries
log-dhcp
